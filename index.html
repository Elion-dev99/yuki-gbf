<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GBF Weapons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/weapons.css">
  <!-- 注意: ローカルファイルとして開くとfetchが動作しないため、HTTPサーバーでホストしてください -->
</head>

<body>

  <div id="weapon-list">読み込み中...</div>

  <script src="js/loadweapons.js"></script>
  <script src="js/renderweapons.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      loadweapons().then(list => {
        renderweapons(list);
      }).catch(error => {
        const container = document.getElementById("weapon-list");
        container.innerHTML = "エラーが発生しました。コンソールを確認してください。";
        console.error("Failed to load weapons:", error);
      });
    });
  </script>

</body>
</html>
