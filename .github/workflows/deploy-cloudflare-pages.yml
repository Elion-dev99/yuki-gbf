name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      # Secrets の有無をステップ条件で使う（空なら Wrangler デプロイをスキップ）
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Check Cloudflare credentials
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare 認証情報が未設定です"
              echo ""
              echo "Wrangler デプロイを有効にするには、リポジトリの **Settings → Secrets and variables → Actions** に次を追加してください:"
              echo ""
              echo "| Secret | 内容 |"
              echo "|--------|------|"
              echo "| \`CLOUDFLARE_API_TOKEN\` | [API Token](https://dash.cloudflare.com/profile/api-tokens)（Edit Cloudflare Workers / Pages Edit） |"
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | ダッシュボードの Account ID |"
              echo ""
              echo "なお Cloudflare Pages の Git 連携（\`pages build and deployment\`）が有効なら、そちらでも自動デプロイされます。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため Wrangler デプロイをスキップします"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=azure-fantasia
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
